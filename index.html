<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Tolls ODGJ</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#10243a;background:#f2f6fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.wrap{width:min(100%,510px)}.head{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:#0b6e91;color:white;font-size:23px}.head strong{font-size:19px}.muted{color:#708294;font-size:13px;margin-top:3px}.card{background:white;border-radius:23px;border:1px solid #deebf3;box-shadow:0 15px 40px #15334a13;padding:28px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.09em;color:#547188;text-transform:uppercase;margin-bottom:12px}label{display:block;font-size:15px;font-weight:650;margin-bottom:10px}.inp{position:relative}input{width:100%;border:2px solid #cbdbe7;border-radius:14px;font-size:34px;font-weight:700;padding:17px 93px 17px 19px;outline:none;color:#173650;transition:.2s}input:focus{border-color:#0b7caa;box-shadow:0 0 0 4px #0b7caa18}.unit{position:absolute;right:17px;top:50%;transform:translateY(-50%);font-size:15px;color:#607c8f;font-weight:650}button{width:100%;padding:16px 18px;border:0;border-radius:13px;background:#087ca2;color:white;font-weight:750;font-size:16px;cursor:pointer;margin-top:15px}button:hover{background:#076688}button:focus-visible{outline:3px solid #9cdbed}.hint{color:#728396;font-size:12px;margin-top:10px}.result{margin-top:23px;padding:22px;border-radius:17px;background:#eaf6fb;border:1px solid #c9e6f2;display:none}.result.show{display:block}.result .val{font-size:43px;letter-spacing:-1.5px;font-weight:800;color:#0b5679;margin:7px 0}.result small{color:#547185}.pill{display:inline-flex;border-radius:99px;padding:5px 10px;font-size:12px;background:white;color:#2b6681;font-weight:650}.line{height:1px;background:#d5e6ef;margin:19px 0 13px}.note{font-size:12px;color:#697e8b;line-height:1.65}.error{display:none;margin-top:14px;padding:14px;background:#fff1ee;color:#9b4035;border-radius:12px;font-size:13px}.error.show{display:block}.footer{text-align:center;font-size:12px;color:#788b9b;line-height:1.7;margin-top:17px}details{margin-top:18px;color:#5a7284;font-size:12px;line-height:1.6}summary{cursor:pointer;font-weight:650}code{background:#eff5f9;padding:2px 4px;border-radius:4px}@media(max-width:450px){body{padding:15px}.card{padding:21px}.result .val{font-size:37px}} .history{margin-top:22px;border-top:1px solid #dbe7ee;padding-top:20px}.history-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.history-head strong{font-size:15px}.daily-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:16px}.daily-controls label{font-size:12px;margin-bottom:5px}.daily-controls input{font-size:14px;padding:9px;width:auto;max-width:180px}.daily-controls button{width:auto;margin:0;padding:10px 12px;font-size:12px;background:#e5f3f8;color:#0b5876}.day-caption{font-size:12px;color:#567187;margin-top:9px}.history-list{margin-top:12px;display:grid;gap:9px}.history-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid #dbe7ee;border-radius:12px;background:#f9fcfe}.history-main{min-width:0}.history-date{color:#708294;font-size:11px;margin-bottom:4px}.history-values{font-size:13px;color:#16374d;line-height:1.6}.history-values b{color:#095b7b}.history-empty{color:#758697;font-size:12px;margin-top:12px}.delete-one,.clear-all{width:auto;margin:0;border-radius:9px;background:#fff1f0;color:#a33b37;border:1px solid #f2d5d2;font-size:12px;font-weight:700;cursor:pointer;padding:9px 11px;flex-shrink:0}.clear-all:hover,.delete-one:hover{background:#ffe4e2}.clear-all{background:transparent;border:0;padding:7px 5px}.hist-note{font-size:11px;color:#81919e;margin-top:12px;line-height:1.5}.backup-controls{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.backup-controls button{width:auto;margin:0;padding:9px 11px;font-size:12px;border-radius:9px;background:#eaf4f9;color:#0a5b7c}.backup-controls button:hover{background:#d8eefa}.storage-warning{margin-top:10px;padding:10px;background:#fff2d9;color:#79541c;border-radius:10px;font-size:12px}.storage-warning[hidden]{display:none}
.auth{padding:17px;border-radius:14px;background:#f4f9fc;margin-bottom:22px;border:1px solid #dceaf3}.auth input{font-size:15px;padding:13px;margin:0 0 10px;font-weight:500}.auth label{font-size:13px;margin:5px 0}.auth button{font-size:14px;padding:12px;margin:5px 0}.auth .secondary{background:#daeaf1;color:#12506b}.auth-message{font-size:12px;color:#9b4035;margin-top:8px}.auth #accountEmail{font-size:13px;overflow-wrap:anywhere}.history-list{max-height:440px;overflow:auto}#f[hidden],.history[hidden],#accountPanel[hidden],#loginFields[hidden]{display:none!important}.status{font-size:12px;color:#5a7284;margin-top:8px} .logoimg{width:92px;height:60px;object-fit:contain;display:block}.result .line:has(+ small:empty){display:none}.result small:empty{display:none}</style></head><body><main class="wrap"><div class="head"><img src="logo-odgj.png" class="logoimg" alt="Logo ODGJ"><div><strong>Tolls ODGJ</strong><div class="muted">Asisten sederhana · 1 jam ke depan</div></div></div><section class="card"><div class="auth" id="authPanel"><div class="eyebrow">Akun pribadi</div><div class="auth-fields" id="loginFields"><label for="email">Email</label><input autocomplete="email" id="email" placeholder="email@contoh.com" type="email"/><label for="password">Password</label><input autocomplete="current-password" id="password" placeholder="Minimal 6 karakter" type="password"/><button id="loginBtn" type="button">Masuk</button><button class="secondary" id="registerBtn" type="button">Daftar akun</button></div><div hidden="" id="accountPanel"><p id="accountEmail"></p><button class="secondary" id="logoutBtn" type="button">Keluar akun</button></div><div aria-live="polite" class="auth-message" id="authMessage"></div></div><form hidden="" id="f"><label for="tma">TMA</label><div class="inp"><input aria-describedby="petunjuk" autocomplete="off" autofocus="" id="tma" inputmode="decimal" placeholder="Contoh: 66,50" required="" type="text"/><span class="unit">mdpl</span></div><div class="hint" id="petunjuk">Masukkan angka lalu tekan <b>Enter</b>.</div><button type="submit">Prediksi 1 Jam Berikutnya →</button></form><div class="error" id="err" role="alert"></div><section aria-live="polite" class="result" id="result"><div class="eyebrow">Perkiraan TMA +1 jam</div><div class="val" id="hasil"></div><span class="pill" id="delta"></span><div class="line"></div><small id="caption"></small></section><section aria-label="Riwayat pengecekan" class="history" hidden=""><div class="history-head"><strong>Riwayat per tanggal (24 jam)</strong><button class="clear-all" id="clearHistory" type="button">Hapus semua</button></div><div class="daily-controls"><div><label for="historyDate">Tanggal riwayat (WIB)</label><input id="historyDate" type="date" aria-label="Tanggal riwayat"/></div><button type="button" id="todayHistory">Hari ini</button><button type="button" id="csvDate">Ekspor CSV tanggal ini</button><button type="button" id="csvAll">Ekspor semua CSV</button></div><div class="day-caption" id="dayCount"></div><div class="history-list" id="historyList"></div><div class="history-empty" id="historyEmpty">Belum ada riwayat pengecekan di akun ini.</div><div class="status" id="syncStatus" role="status"></div></section></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
// Configuration lives in config.js, which contains only the PUBLIC Supabase anon key.
const form=document.getElementById('f'),input=document.getElementById('tma'),result=document.getElementById('result'),err=document.getElementById('err');
const fmt=n=>n.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
const HOURLY_PATTERN=[{"median":-0.0718,"count":388},{"median":-0.0733,"count":388},{"median":-0.0604,"count":388},{"median":-0.0558,"count":388},{"median":-0.0463,"count":388},{"median":-0.05,"count":388},{"median":-0.0592,"count":389},{"median":-0.0625,"count":389},{"median":-0.0492,"count":389},{"median":-0.03,"count":389},{"median":-0.0296,"count":390},{"median":-0.0308,"count":390},{"median":-0.0083,"count":390},{"median":0.0012,"count":390},{"median":0.0246,"count":390},{"median":0.1525,"count":390},{"median":0.1708,"count":388},{"median":0.1667,"count":388},{"median":0.1475,"count":389},{"median":0.1092,"count":389},{"median":0.04,"count":389},{"median":-0.02,"count":389},{"median":-0.0367,"count":389},{"median":-0.0525,"count":384}];
// The observation at the current WIB clock hour uses the corresponding historical one-hour interval.
function wibHour(){return Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',hourCycle:'h23'}).format(new Date()))}
form.addEventListener('submit',ev=>{
 ev.preventDefault();result.classList.remove('show');err.classList.remove('show');
 const s=input.value.trim().replace(',','.');const n=Number(s);
 if(!s||!Number.isFinite(n)){err.textContent='Masukkan angka TMA yang valid.';err.classList.add('show');return}
 const pattern=HOURLY_PATTERN[wibHour()];const d=pattern.median;
 document.getElementById('hasil').textContent=fmt(n+d)+' mdpl';
 document.getElementById('delta').textContent=(d>0?'Perkiraan naik +':d<0?'Perkiraan turun ':'Perkiraan stabil ')+fmt(Math.abs(d))+' m';
 document.getElementById('caption').textContent='';result.classList.add('show');
 saveCheck(n,n+d,d,pattern.count);
});
let client=null, user=null, historyEntries=[];
const el=id=>document.getElementById(id);
const historyList=el('historyList'),historyEmpty=el('historyEmpty'),clearHistory=el('clearHistory');
const setMessage=t=>el('authMessage').textContent=t||'';
const setStatus=t=>el('syncStatus').textContent=t||'';
function clientReady(){return !!client && !!user}
function renderAuth(){const logged=!!user;el('loginFields').hidden=logged;el('accountPanel').hidden=!logged;el('f').hidden=!logged;document.querySelector('.history').hidden=!logged;if(logged)el('accountEmail').textContent='Masuk sebagai: '+user.email;else{historyEntries=[];drawHistory();result.classList.remove('show')}}
const wibDate=(iso)=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(iso));
const todayWib=()=>wibDate(new Date().toISOString());
let selectedDate=todayWib();
el('historyDate').value=selectedDate;
function filteredHistory(){return historyEntries.filter(x=>wibDate(x.created_at)===selectedDate)}
function drawHistory(){
  const visible=filteredHistory();historyList.replaceChildren();historyEmpty.hidden=visible.length>0;
  historyEmpty.textContent='Belum ada pengecekan pada tanggal ini.';
  clearHistory.hidden=historyEntries.length===0;
  el('dayCount').textContent=visible.length+' pengecekan pada '+new Date(selectedDate+'T12:00:00+07:00').toLocaleDateString('id-ID',{dateStyle:'full',timeZone:'Asia/Jakarta'})+' · Total tersimpan: '+historyEntries.length;
  for(const entry of visible){const row=document.createElement('div');row.className='history-row';const main=document.createElement('div');main.className='history-main';const date=document.createElement('div');date.className='history-date';date.textContent=new Date(entry.created_at).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Jakarta'})+' WIB';const vals=document.createElement('div');vals.className='history-values';vals.textContent='Input: '+fmt(Number(entry.current_tma))+' mdpl → ';const predicted=document.createElement('b');predicted.textContent=fmt(Number(entry.predicted_tma))+' mdpl';vals.append(predicted);main.append(date,vals);const del=document.createElement('button');del.className='delete-one';del.type='button';del.textContent='Hapus';del.addEventListener('click',async()=>{if(!clientReady())return;if(!confirm('Hapus pengecekan ini secara permanen?'))return;del.disabled=true;const {error}=await client.from('tma_checks').delete().eq('id',entry.id);if(error){alert('Gagal menghapus: '+error.message);del.disabled=false;return}historyEntries=historyEntries.filter(x=>x.id!==entry.id);drawHistory()});row.append(main,del);historyList.append(row)}
}
async function loadHistory(){
 if(!clientReady())return;
 setStatus('Memuat seluruh riwayat dari Supabase...');
 const all=[];const pageSize=500;
 for(let from=0; ;from+=pageSize){
  const {data,error}=await client.from('tma_checks').select('id,created_at,current_tma,predicted_tma').order('created_at',{ascending:false}).order('id',{ascending:false}).range(from,from+pageSize-1);
  if(error){setStatus('Gagal memuat riwayat: '+error.message);return}
  all.push(...(data||[]));if(!data||data.length<pageSize)break;
 }
 historyEntries=all;drawHistory();setStatus('Tersinkron · '+all.length+' pengecekan tersimpan di Supabase.');
}
function downloadCSV(entries,filename){
 const rows=[['tanggal_WIB','jam_WIB','tma_input_mdpl','prediksi_1_jam_mdpl','selisih_prediksi_minus_input_m']];
 for(const x of entries){const d=new Date(x.created_at);const date=wibDate(x.created_at);const time=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d);const current=Number(x.current_tma),pred=Number(x.predicted_tma);rows.push([date,time,current.toFixed(2),pred.toFixed(2),(pred-current).toFixed(2)])}
 const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)
}
el('historyDate').addEventListener('change',ev=>{if(!ev.target.value)return;selectedDate=ev.target.value;drawHistory()});
el('todayHistory').addEventListener('click',()=>{selectedDate=todayWib();el('historyDate').value=selectedDate;drawHistory()});
el('csvDate').addEventListener('click',()=>{if(!clientReady())return;downloadCSV(filteredHistory(),'tolls-odgj-'+selectedDate+'.csv')});
el('csvAll').addEventListener('click',()=>{if(!clientReady())return;downloadCSV(historyEntries,'tolls-odgj-semua-riwayat-'+todayWib()+'.csv')});
async function saveCheck(current,predicted,delta,count){if(!clientReady())return;setStatus('Menyimpan pengecekan...');const {error}=await client.from('tma_checks').insert({user_id:user.id,current_tma:current,predicted_tma:predicted,delta_tma:delta,neighbor_count:count});if(error){setStatus('Penyimpanan GAGAL: '+error.message);alert('Prediksi tampil, tetapi riwayat gagal disimpan. '+error.message);return}selectedDate=todayWib();el('historyDate').value=selectedDate;await loadHistory()}
clearHistory.addEventListener('click',async()=>{if(!clientReady())return;if(!confirm('Hapus SEMUA riwayat seluruh tanggal secara permanen?'))return;const {error}=await client.from('tma_checks').delete().eq('user_id',user.id);if(error){alert('Gagal menghapus: '+error.message);return}await loadHistory()});
el('loginBtn').addEventListener('click',async()=>{if(!client)return;setMessage('Memproses login...');const {error}=await client.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});setMessage(error?'Gagal masuk: '+error.message:'')});
el('registerBtn').addEventListener('click',async()=>{if(!client)return;setMessage('Mendaftarkan akun...');const {error,data}=await client.auth.signUp({email:el('email').value.trim(),password:el('password').value});setMessage(error?'Gagal daftar: '+error.message:data.session?'Akun berhasil dibuat.':'Periksa email untuk konfirmasi pendaftaran, lalu masuk.')});
el('logoutBtn').addEventListener('click',async()=>{if(client)await client.auth.signOut()});
async function init(){if(typeof window.supabase==='undefined'){setMessage('Gagal memuat Supabase SDK. Periksa koneksi internet.');return}if(!window.TMA_CONFIG?.url||!window.TMA_CONFIG?.anonKey||window.TMA_CONFIG.url.includes('YOUR_PROJECT')){setMessage('Konfigurasi belum diisi. Buka config.js dan masukkan Supabase Project URL + anon key.');return}try{client=window.supabase.createClient(window.TMA_CONFIG.url,window.TMA_CONFIG.anonKey)}catch(e){setMessage('Konfigurasi tidak valid: '+e.message);return}
client.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;renderAuth();if(user)setTimeout(loadHistory,0)});const {data,error}=await client.auth.getSession();if(error)setMessage(error.message);user=data?.session?.user||null;renderAuth();if(user)await loadHistory()}
init();
</script></body></html>
